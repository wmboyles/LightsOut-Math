name = "LightsOut-Math"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["nullity2.nullity2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "nullity2.Core"
srcDir = "tex"

[[lean_lib]]
name = "nullity2.MirroredPath"
srcDir = "tex"

[[lean_lib]]
name = "nullity2.Grid"
srcDir = "tex"

[[lean_lib]]
name = "nullity2.GridFive"
srcDir = "tex"

[[lean_lib]]
name = "nullity2.nullity2"
srcDir = "tex"
